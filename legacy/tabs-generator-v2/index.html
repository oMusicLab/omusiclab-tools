    <aside class="sidebar panel-left mousescroll">
        <a href="https://omusiclab-landingpage.vercel.app/"><img src="./favicon.svg" alt="oMusic Laboratory" class="site-logo"></a>
        <div class="nav-panel">
            <label for="nav-panel">Workspace</label>
            <ul data-value="workspace">
                <li class=""><div class="dropdown" data-type="number">
                    <label for="dropdown">Selected Tab</label>
                    <select id="staff-selector"></select>
                </div></li>
                <li>
                    <div class="textarea">
                        <label for="textarea">Lyrics</label>
                        <textarea class="mousescroll" id="generator_lyrics" placeholder="Write something here.." spellcheck="false"></textarea>
                    </div>
                </li>
                <li class="btn #testseparator" title="New Bar" id="tabs-generator_bar">Add a bar</li>
                <li class="btn" title="Create a new tab" id="tabs-generator_new-staff">Create a new tab</li>
                <li class="btn" title="Clear selected tab" id="tabs-generator_clear">Clear selected tab</li>
                <li class="btn" title="Delete selected tab" id="tabs-generator_delete">Delete selected tab</li>
                <li class="btn" title="Reset Workspace" id="tabs-generator_reset">Reset Workspace</li>
            </ul>
        </div>
        <div class="nav-panel">
            <label for="nav-panel">Preference</label>
            <ul data-value="preference">
                <li>
                    <div class="dropdown" data-type="text">
                        <label for="dropdown">Instrument</label>
                        <select id="instrument-selector"><option value="guitar">guitar</option><option value="ukulele">ukulele</option></select>
                    </div>
                    <div class="switch">
                        <label for="switch">show notes</label>
                        <nav class="nav" data-value="viewNotes"></nav>
                    </div>
                    <div class="switch">
                        <label for="switch">Dark theme</label>
                        <nav id="dark-theme" class="nav" data-value="dark-theme"></nav>
                    </div>
                    <!-- <div class="switch" checked="checked">
                        <label for="switch">Animation</label>
                        <nav class="nav" data-value="animation"></nav>
                    </div> -->
                </li>
            </ul>
        </div>
        <div class="nav-panel">
            <label for="nav-panel" style="font-size: .75em; margin-top: 3em;">© 2020 oMusic Tabs Generator - v.2.0.0</label>
        </div>
    </aside>

        <div id="inst">
            <div id="alert-container"></div>
            <ul class="settings" style="display: none;">
                <li><strong>Powered by: </strong><span>oMusic tabs generator JS library</span></li>
                <li class="switch" checked="">
                    <label for="switch">tabs seq</label>
                    <span id="tabs-seq-screen-2">0</span>
                    <label for="switch">:</label>
                    <nav class="nav" data-value="viewTabs"></nav>
                </li>
                <li id="tab-sequence" class="pager">
                    <button title="Show all tabs" id="tab-seq-all" class="w-m">show all</button>
                    <content id="tabs-seq-screen-1" class="pager-screen w-s">all</content>
                    <button title="Previous" id="tab-seq-prev" class="#testleft">Previous</button>
                    <button title="Next" id="tab-seq-next" class="#testright">Next</button>
                    <button title="Edit" id="tab-seq-edit" class="#testedit" hidden="">Edit</button>
                    <button title="Delete" id="tab-seq-delete" class="#testdelete" hidden="">Delete</button>
                    <button title="Save" id="tab-seq-save" class="#testsave" hidden="">Save</button>
                    <button title="Back" id="tab-seq-back" class="#testback" hidden="">Back</button>
                </li>
            </ul>
        </div>

        <section id="body-container" class="container-fluid">
            <div class="row">
                <div class="col-md-12">
                    <pre id="content" class="copy" data-copy="tabs-generator"></pre>
                </div>
            </div>
        </section>
        <footer>
            <p>Powered by <strong>oMusic JS Library</strong></p>
        </footer>
