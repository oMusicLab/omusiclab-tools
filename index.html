<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#106347" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="OML Tools" />
    <title>omusiclab tools</title>
    <link rel="icon" type="image/svg+xml" href="./shared/favicon.svg" />
    <link rel="apple-touch-icon" href="./shared/favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700&display=swap"
    />
    <link rel="stylesheet" href="./shared/omusiclab-theme.css" />
    <link rel="stylesheet" href="./shared/oml-hub.css" />
    <script defer>
      if (window.location.hostname.endsWith(".vercel.app")) {
        fetch("https://tools.omusiclab.com", { mode: "no-cors" })
          .then(function () {
            window.location.replace(
              "https://tools.omusiclab.com" + window.location.pathname
            );
          })
          .catch(function () {});
      }
    </script>
  </head>
  <body>
    <main id="body-container"></main>

    <footer>
      <p>
        Part of <a href="https://omusiclab-landingpage.vercel.app/" target="_blank" rel="noopener noreferrer">omusiclab</a>
      </p>
    </footer>

    <script defer src="./shared/oml-external-links.js"></script>
    <script defer src="./shared/oml-logo-mark.js"></script>
    <script defer src="./shared/oml-hub.js"></script>
  </body>
</html>
