<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>omusiclab tools</title>
    <link rel="stylesheet" href="./shared/omusiclab-theme.css" />
    <link rel="stylesheet" href="./shared/oml-hub.css" />
    <script>
      // Check if the user is visiting via the vercel.app URL
      if (window.location.hostname.endsWith('.vercel.app')) {
        // Attempt to ping your custom domain silently
        fetch('https://tools.omusiclab.com', { mode: 'no-cors' })
          .then(() => {
            // If successful, redirect to the custom domain
            window.location.replace('https://tools.omusiclab.com' + window.location.pathname);
          })
          .catch(() => {
            // If the custom domain is expired/dead, do nothing 
            // The user stays safely on the vercel.app URL
            console.log('Custom domain unavailable, staying on vercel.app');
          });
      }
    </script>
  </head>
  <body>
    <main id="body-container"></main>

    <footer>
      <p>
        Part of <a href="https://omusiclab-landingpage.vercel.app/">omusiclab</a>
      </p>
    </footer>

    <script src="./shared/oml-logo-mark.js"></script>
    <script src="./shared/oml-hub.js"></script>
  </body>
</html>
